
workflows:
  rafiq-android:
    name: Rafiq Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: flutter create --platforms=android --project-name rafiq .
      - name: Get dependencies
        script: flutter pub get
      - name: Build test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      
